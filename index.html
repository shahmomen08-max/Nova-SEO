<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova SEO & Domain Intelligence Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">N</div>
                <div>
                    <span class="font-bold text-lg tracking-tight text-white">Nova SEO</span>
                    <span class="text-xs text-indigo-400 block font-medium">Domain Intelligence Suite</span>
                </div>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                Secure Backend Connected
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Bulk Domain Inspector</h1>
            <p class="text-slate-400 mt-1 text-sm">Analyze PageRank, Google Indexation, and Spam Risk securely.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-10">
            <label class="block text-sm font-semibold text-slate-300 mb-2">Target Domains (One per line):</label>
            <textarea id="domainInput" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono" placeholder="cuny.edu&#10;newschool.edu"></textarea>
            
            <div class="mt-4 flex justify-between items-center">
                <span class="text-xs text-slate-400">Keys are securely hidden on server.</span>
                <button onclick="analyzeDomains()" id="btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition-all flex items-center space-x-2">
                    <span>Run SEO Analysis</span>
                </button>
            </div>
        </div>

        <div id="resultContainer" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">Analysis Report</h2>
                <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-4 py-2 rounded-lg border border-slate-700">Export CSV</button>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
                        <tr>
                            <th class="p-4">Domain</th>
                            <th class="p-4">PageRank</th>
                            <th class="p-4">Global Rank</th>
                            <th class="p-4">Indexed Pages</th>
                            <th class="p-4">Spam Risk</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let lastResultData = [];
        async function analyzeDomains() {
            const input = document.getElementById('domainInput').value.trim();
            if (!input) return alert('Please enter at least one domain!');

            const domains = input.split('\n').map(d => d.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '')).filter(Boolean);
            const btn = document.getElementById('btn');
            btn.innerText = 'Analyzing...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domains })
                });

                const json = await res.json();
                if (json.success) {
                    lastResultData = json.data;
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';
                    
                    json.data.forEach(item => {
                        let riskBadge = item.spamRisk === 'High Risk' ? 
                            `<span class="px-2.5 py-1 rounded-md text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20">High Risk</span>` : 
                            `<span class="px-2.5 py-1 rounded-md text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Safe</span>`;

                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-800/50">
                                <td class="p-4 font-mono text-white">${item.domain}</td>
                                <td class="p-4 text-indigo-400">${item.pageRank} / 10</td>
                                <td class="p-4">#${item.globalRank}</td>
                                <td class="p-4">${item.googleIndexedResults}</td>
                                <td class="p-4">${riskBadge}</td>
                            </tr>
                        `;
                    });
                    document.getElementById('resultContainer').classList.remove('hidden');
                } else {
                    alert(json.error);
                }
            } catch (err) {
                alert('Connection error!');
            } finally {
                btn.innerText = 'Run SEO Analysis';
                btn.disabled = false;
            }
        }

        function exportCSV() {
            if (!lastResultData.length) return;
            let csv = 'Domain,PageRank,Global Rank,Indexed Pages,Spam Risk\n';
            lastResultData.forEach(r => csv += `"${r.domain}",${r.pageRank},"${r.globalRank}","${r.googleIndexedResults}","${r.spamRisk}"\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'nova_report.csv'; a.click();
        }
    </script>
</body>
</html>
